<svg viewBox="0 0 880 410" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" role="img" aria-label="OpenPAVE brain-body architecture: a brain panel and a body panel connected by one pluggable seam (raw_zenoh: a direct zenoh link, or device_connect: Arm Device Connect auto-discovery)">
  <style>
    .bg{fill:#eef3f3}
    .panel{fill:#ffffff;stroke:#d3dedd;stroke-width:1.4}
    .row{fill:#fbfdfd;stroke:#dce7e6;stroke-width:1}
    .brainh{fill:#e6e8fb} .brainb{stroke:#5666d6} .braintab{fill:#5666d6} .braint{fill:#3a41b0}
    .bodyh{fill:#f6e8d6} .bodyb{stroke:#bf7228} .bodytab{fill:#bf7228} .bodyt{fill:#8a5710}
    .seam{fill:#d7ece8;stroke:#0c8478;stroke-width:2.4}
    .pill{fill:#ffffff;stroke:#0c8478;stroke-width:1.3}
    .seamt{fill:#075e55} .acc{fill:#0c8478;stroke:#0c8478}
    .ink{fill:#12191b} .soft{fill:#5c6a6c} .safety{fill:#c6412f}
    .m{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
    @media (prefers-color-scheme:dark){
      .bg{fill:#0d1416}
      .panel{fill:#141d1f;stroke:#26332f} .row{fill:#101a1b;stroke:#233230}
      .brainh{fill:#1b2242} .brainb{stroke:#8e9bf0} .braintab{fill:#8e9bf0} .braint{fill:#aeb7f5}
      .bodyh{fill:#33240f} .bodyb{stroke:#e0a35c} .bodytab{fill:#e0a35c} .bodyt{fill:#e6ad6a}
      .seam{fill:#0f2b28;stroke:#2fd0bd} .pill{fill:#0c1a19;stroke:#2fd0bd}
      .seamt{fill:#7fe6da} .acc{fill:#2fd0bd;stroke:#2fd0bd}
      .ink{fill:#e8f0ef} .soft{fill:#93a3a5} .safety{fill:#f0836f}
    }
  </style>
  <defs>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="3.6" refY="2.5" orient="auto-start-reverse">
      <path d="M0,0 L5,2.5 L0,5" class="acc" fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="880" height="410"/>

  <text class="ink" x="36" y="38" font-size="21" font-weight="700">OpenPAVE — Brain, Body &amp; the Seam</text>
  <text class="soft" x="36" y="59" font-size="12.5">One pluggable seam · <tspan class="m" font-size="12">{action, params}</tspan> down, state up</text>

  <!-- ===== BRAIN ===== -->
  <rect class="panel brainb" x="40" y="86" width="268" height="308" rx="16"/>
  <rect class="brainh" x="52" y="98" width="244" height="38" rx="10"/>
  <text class="braint" x="68" y="123" font-size="16.5" font-weight="700">Brain</text>
  <text class="soft" x="120" y="123" font-size="11">— Armv9: DGX, Thor, Radxa O6</text>
  <rect class="row" x="52" y="148" width="244" height="60" rx="10"/><rect class="braintab" x="54" y="156" width="4" height="44" rx="2"/>
  <text class="ink" x="68" y="173" font-size="14" font-weight="600">VLM / VLA inference</text>
  <text class="soft m" x="68" y="192" font-size="11">vLLM · OpenAI-compatible</text>
  <rect class="row" x="52" y="216" width="244" height="60" rx="10"/><rect class="braintab" x="54" y="224" width="4" height="44" rx="2"/>
  <text class="ink" x="68" y="241" font-size="14" font-weight="600">Intent → capability</text>
  <text class="soft m" x="68" y="260" font-size="11">{action, params}</text>
  <rect class="row" x="52" y="284" width="244" height="60" rx="10"/><rect class="braintab" x="54" y="292" width="4" height="44" rx="2"/>
  <text class="ink" x="68" y="309" font-size="14" font-weight="600">Seam client</text>
  <text class="soft m" x="68" y="328" font-size="11">create_seam_transport()</text>
  <text class="soft m" x="68" y="372" font-size="11">local-first · no cloud</text>

  <!-- ===== SEAM ===== -->
  <rect class="seam" x="348" y="114" width="184" height="252" rx="16"/>
  <text class="seamt m" x="440" y="144" font-size="16" font-weight="700" text-anchor="middle">◆ SEAM</text>
  <text class="soft" x="440" y="165" font-size="11" text-anchor="middle">the only boundary</text>
  <text class="soft" x="440" y="179" font-size="11" text-anchor="middle">OpenPAVE owns</text>
  <rect class="pill" x="362" y="195" width="156" height="30" rx="8"/>
  <text class="seamt m" x="440" y="215" font-size="12.5" font-weight="600" text-anchor="middle">raw_zenoh</text>
  <text class="soft" x="440" y="237" font-size="9" text-anchor="middle">direct zenoh link · peer to peer</text>
  <rect class="pill" x="362" y="253" width="156" height="30" rx="8"/>
  <text class="seamt m" x="440" y="273" font-size="12.5" font-weight="600" text-anchor="middle">device_connect</text>
  <text class="soft" x="440" y="295" font-size="9" text-anchor="middle">Arm Device Connect · auto-discover</text>
  <text class="soft m" x="440" y="326" font-size="10" text-anchor="middle">▸ action  ◂ state  ⟳ heartbeat</text>

  <!-- ===== bidirectional connectors ===== -->
  <line class="acc" x1="310" y1="240" x2="346" y2="240" stroke-width="2.2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <line class="acc" x1="534" y1="240" x2="570" y2="240" stroke-width="2.2" marker-start="url(#ar)" marker-end="url(#ar)"/>

  <!-- ===== BODY ===== -->
  <rect class="panel bodyb" x="572" y="86" width="268" height="308" rx="16"/>
  <rect class="bodyh" x="584" y="98" width="244" height="38" rx="10"/>
  <text class="bodyt" x="600" y="123" font-size="16.5" font-weight="700">Body</text>
  <text class="soft" x="646" y="123" font-size="11">— PuppyPi, RPi camera, RCU</text>
  <rect class="row" x="584" y="148" width="244" height="60" rx="10"/><rect class="bodytab" x="822" y="156" width="4" height="44" rx="2"/>
  <text class="ink" x="600" y="173" font-size="14" font-weight="600">Robot / sensor adapter</text>
  <text class="soft m" x="600" y="192" font-size="11">puppypi_bridge · camera_usb</text>
  <rect class="row" x="584" y="216" width="244" height="60" rx="10"/><rect class="bodytab" x="822" y="224" width="4" height="44" rx="2"/>
  <text class="ink" x="600" y="241" font-size="14" font-weight="600">dispatch → capability</text>
  <text class="soft m" x="600" y="260" font-size="11">{action, params} → state</text>
  <rect class="row" x="584" y="284" width="244" height="60" rx="10"/><rect class="safety" x="822" y="292" width="4" height="44" rx="2"/>
  <text class="safety" x="600" y="309" font-size="14" font-weight="600">★ Fail-safe · STOP</text>
  <text class="soft m" x="600" y="328" font-size="11">disconnect → halt</text>
  <text class="soft m" x="600" y="372" font-size="11">servos · camera · IMU (on-board)</text>
</svg>
